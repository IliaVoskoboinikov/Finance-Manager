name: CI

on:
  push:
    branches:
      - master
      - 'releases/**'
  pull_request:

# Новый push в ту же ветку/PR отменяет предыдущий прогон: десяток джоб на устаревший
# коммит никому не нужен. На master прогоны не отменяем — там важна история статусов.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Явные права токена: раньше воркфлоу полагался на настройку репозитория по умолчанию.
permissions:
  contents: read
  security-events: write  # upload-sarif (detekt, ktlint, aalekh)
  checks: write           # action-junit-report создаёт check-run с аннотациями
  pull-requests: write    # aalekhDiff — комментарий об изменениях архитектуры в PR

env:
  gradleFlags: --parallel --stacktrace --no-configuration-cache --no-daemon
  API_TOKEN: ${{ secrets.API_TOKEN }}
  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/android-setup
      - name: Build project
        run: ./gradlew assembleDebug $gradleFlags
      - name: Generate build time report
        uses: ./.github/actions/build-time-report
        with:
          file: app/build/reports/buildTimeTracker/build.csv
          output-file: buildTime.csv
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  run-tests:
    runs-on: ubuntu-latest
    steps:
      # Полная история нужна AffectedModuleDetector: он ищет merge-base с master.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup environment
        uses: ./.github/actions/android-setup
      # На master — полный прогон: основная ветка проверяется целиком.
      # --continue: собираем отчёт по всем модулям, а не до первого упавшего.
      - name: Run all unit tests
        if: github.ref == 'refs/heads/master'
        run: ./gradlew test $gradleFlags --continue
      # На ветках и в PR — только модули, задетые диффом, и их обратные зависимости.
      # :konsist исключён из детектора (он читает исходники с диска, а не через
      # зависимости Gradle), поэтому запускается явно.
      - name: Run affected unit tests
        if: github.ref != 'refs/heads/master'
        run: ./gradlew runAffectedUnitTests :konsist:test $gradleFlags --continue
      # Раскладывает JUnit XML в аннотации прямо на строках упавших тестов + сводку в Summary.
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/test*/TEST-*.xml'
          check_name: Unit tests
          detailed_summary: true
          include_passed: false
          fail_on_failure: true
      - name: Upload test HTML reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests-html
          path: '**/build/reports/tests/**'

  run-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/android-setup
      - name: Coverage report & gate
        uses: ./.github/actions/coverage
        with:
          gradle-flags: ${{ env.gradleFlags }}
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-coverage-html
          path: build/reports/kover/htmlFull

  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/android-setup
      - name: Run Android Lint
        run: ./gradlew lint
      - name: Upload Lint HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-html
          path: |
            **/build/reports/lint-results*.html
  #      - name: Upload SARIF to GitHub Code Scanning
  #        if: always()
  #        uses: github/codeql-action/upload-sarif@v4
  #        with:
  #          sarif_file: |
  #            lint/build/reports/lint-results.sarif

  run-detekt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/android-setup
      - name: Run Detekt
        run: ./gradlew detekt $gradleFlags --continue
        continue-on-error: true
      - name: Generate Markdown report
        if: always()
        run: cat build/reports/detekt/detekt.md > $GITHUB_STEP_SUMMARY
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt.html
          path: build/reports/detekt/detekt.html
      - name: Fail if Detekt found issues
        if: always()
        run: |
          if grep -q "<error" build/reports/detekt/detekt.xml; then
            echo "Detekt found issues!"
            exit 1
          else
            echo "No Detekt issues."
          fi

  run-ktlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/android-setup
      - name: Run KtLint composite action
        uses: ./.github/actions/ktlint
        with:
          gradle-flags: ${{ env.gradleFlags }}
      - name: Report-renderer
        uses: ./.github/actions/report-renderer
        with:
         input-file: ktlint-report.md
         output-file: ktlint-report.html
      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: merged-ktlint.sarif
          category: ktlint
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-html-report
          path: ktlint-report.html

  check-app-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/android-setup
      - name: Analyze size
        run: ./gradlew :app:analyzeDebugBundle $gradleFlags
      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: ruler-report.html
          path: app/build/reports/ruler/debug/report.html

  # Блокирующая проверка: release-classpath приложения должен совпадать со слепком
  # app/dependencies/releaseRuntimeClasspath.txt. Быстрая, идёт на каждый PR.
  # Разошлось — обновить осознанно: ./gradlew :app:dependencyGuardBaseline
  check-dependency-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/android-setup
      - name: Dependency guard
        run: ./gradlew :app:dependencyGuard $gradleFlags

  # Рекомендательный отчёт о здоровье зависимостей: неиспользуемые и неверно
  # объявленные зависимости. Идёт на каждый прогон, но намеренно НЕ блокирует —
  # все severity выставлены в "warn" в корневом build.gradle.kts, и отчёт
  # разбирается постепенно. continue-on-error, а в required-чеках её нет:
  # PR не должен ждать девять минут ради текста, который читают раз в месяц.
  dependency-analysis:
    runs-on: ubuntu-latest
    continue-on-error: true
    # Самая долгая джоба пайплайна: на холодном кэше это ~6700 задач.
    # Ограничение, чтобы зависшая сборка не висела до дефолтных шести часов.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/android-setup
      # Задачи анализа исполняются через IsolatedClassloaderWorker: каждый work item
      # получает свой classloader, а его классы живут в Metaspace. На холодном кэше
      # это 4000+ задач, и дефолтного -XX:MaxMetaspaceSize=1g из gradle.properties
      # не хватает — джоба падала с OutOfMemoryError: Metaspace. Поэтому здесь
      # свой лимит и последовательное исполнение вместо --parallel: меньше
      # одновременно живых загрузчиков.
      - name: Dependency analysis
        run: >
          ./gradlew buildHealth --stacktrace --no-configuration-cache --no-daemon
          --max-workers=2
          "-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
      - name: Publish advice to summary
        if: always()
        run: |
          REPORT=build/reports/dependency-analysis/build-health-report.txt
          {
            echo '## Dependency analysis'
            if [ -f "$REPORT" ]; then
              echo "Полный отчёт — в артефакте \`dependency-analysis-report\` ($(wc -l < "$REPORT") строк)."
              echo '```'
              head -200 "$REPORT"
              echo '```'
            else
              echo 'Отчёт не сформирован.'
            fi
          } >> $GITHUB_STEP_SUMMARY
      - name: Upload dependency analysis report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-analysis-report
          path: build/reports/dependency-analysis/

  check-module-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/android-setup
      - name: Check Graph
        run: ./gradlew :app:assertModuleGraph $gradleFlags
      - name: Generate graph
        run: ./gradlew :app:generateModulesGraphvizText -Pmodules.graph.output.gv=all_modules $gradleFlags
      - name: Generate Markdown report
        run: |
          set -e
          echo '```' > $GITHUB_STEP_SUMMARY
          cat all_modules >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Draw graph
        uses: ./.github/actions/draw-graph
        with:
          input-file: all_modules
          output-file: all_modules.png
      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: all_modules.png
          path: all_modules.png

  # Блокирующая проверка архитектуры графа модулей (Aalekh): слои, изоляция фич,
  # reachability, запрет циклов и ratchet структурных метрик. В отличие от
  # check-module-graph (jraska), правила здесь реально настроены (build.gradle.kts →
  # блок aalekh { }). Падает только на НОВЫХ нарушениях — текущие заморожены в
  # aalekh-baseline.json. Полное описание — docs/aalekh.md.
  check-architecture:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — aalekhDiff сравнивает граф ветки с закоммиченным aalekh-snapshot.json,
      # а комментарий в PR требует доступа к истории для корректного diff.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup environment
        uses: ./.github/actions/android-setup
      - name: Architecture check (Aalekh)
        run: ./gradlew aalekhCheck $gradleFlags
      # Нарушения — инлайн-аннотациями прямо в диффе PR (SARIF).
      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/aalekh/aalekh-results.sarif
          category: aalekh
      # Интерактивный HTML-отчёт + метрики (CSV) как артефакт сборки.
      - name: Generate interactive report
        if: always()
        run: ./gradlew aalekhReport $gradleFlags
      - name: Upload Aalekh report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aalekh-report
          path: build/reports/aalekh/
      # Что PR сделал с архитектурой (добавленные/удалённые рёбра, модули, циклы) — одним
      # «липким» комментарием, который обновляется на каждый push, а не плодит новые.
      - name: Architecture diff
        if: github.event_name == 'pull_request'
        run: ./gradlew aalekhDiff $gradleFlags
      - name: Tag diff for a sticky comment
        if: github.event_name == 'pull_request'
        run: |
          DIFF=build/reports/aalekh/aalekh-diff.md
          if [ -f "$DIFF" ]; then
            printf '<!-- aalekh-diff -->\n\n' | cat - "$DIFF" > "$DIFF.tmp" && mv "$DIFF.tmp" "$DIFF"
          fi
      - name: Find existing architecture comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: aalekh-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- aalekh-diff -->'
      - name: Comment architecture diff on PR
        if: ${{ github.event_name == 'pull_request' && hashFiles('build/reports/aalekh/aalekh-diff.md') != '' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.aalekh-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: build/reports/aalekh/aalekh-diff.md
          edit-mode: replace

  nav-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/android-setup
      - name: Nav graph report
        uses: ./.github/actions/nav-graph
        with:
          gradle-flags: ${{ env.gradleFlags }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nav-graph-report
          path: nav-graph-report
