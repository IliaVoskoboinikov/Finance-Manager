name: CI

on:
  push:
    branches:
      - master
      - 'releases/**'
  pull_request:

# Новый push в ту же ветку/PR отменяет предыдущий прогон: 10 джоб на устаревший коммит
# никому не нужны. На master прогоны не отменяем — там важна история статусов.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Явные права токена: раньше воркфлоу полагался на настройку репозитория по умолчанию.
permissions:
  contents: read
  security-events: write  # upload-sarif (detekt, ktlint)
  checks: write           # action-junit-report создаёт check-run с аннотациями

env:
  gradleFlags: --parallel --stacktrace --no-configuration-cache --no-daemon
  API_TOKEN: ${{ secrets.API_TOKEN }}
  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/android-setup
      - name: Build project
        run: ./gradlew assembleDebug $gradleFlags
      - name: Generate build time report
        uses: ./.github/actions/build-time-report
        with:
          file: app/build/reports/buildTimeTracker/build.csv
          output-file: buildTime.csv
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  run-tests:
    runs-on: ubuntu-latest
    steps:
      # Полная история нужна AffectedModuleDetector: он ищет merge-base с master.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup environment
        uses: ./.github/actions/android-setup
      # На master — полный прогон: основная ветка проверяется целиком.
      # --continue: собираем отчёт по всем модулям, а не до первого упавшего.
      - name: Run all unit tests
        if: github.ref == 'refs/heads/master'
        run: ./gradlew test $gradleFlags --continue
      # На ветках и в PR — только модули, задетые диффом, и их обратные зависимости.
      # :konsist исключён из детектора (он читает исходники с диска, а не через
      # зависимости Gradle), поэтому запускается явно.
      - name: Run affected unit tests
        if: github.ref != 'refs/heads/master'
        run: ./gradlew runAffectedUnitTests :konsist:test $gradleFlags --continue
      # Раскладывает JUnit XML в аннотации прямо на строках упавших тестов + сводку в Summary.
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/test*/TEST-*.xml'
          check_name: Unit tests
          detailed_summary: true
          include_passed: false
          fail_on_failure: true
      - name: Upload test HTML reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-html
          path: '**/build/reports/tests/**'

  run-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/android-setup
      - name: Coverage report & gate
        uses: ./.github/actions/coverage
        with:
          gradle-flags: ${{ env.gradleFlags }}
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-coverage-html
          path: build/reports/kover/htmlFull

  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/android-setup
      - name: Run Android Lint
        run: ./gradlew lint
      - name: Upload Lint HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-html
          path: |
            **/build/reports/lint-results*.html
  #      - name: Upload SARIF to GitHub Code Scanning
  #        if: always()
  #        uses: github/codeql-action/upload-sarif@v4
  #        with:
  #          sarif_file: |
  #            lint/build/reports/lint-results.sarif

  run-detekt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/android-setup
      - name: Run Detekt
        run: ./gradlew detekt $gradleFlags --continue
        continue-on-error: true
      - name: Generate Markdown report
        if: always()
        run: cat build/reports/detekt/detekt.md > $GITHUB_STEP_SUMMARY
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt.html
          path: build/reports/detekt/detekt.html
      - name: Fail if Detekt found issues
        if: always()
        run: |
          if grep -q "<error" build/reports/detekt/detekt.xml; then
            echo "Detekt found issues!"
            exit 1
          else
            echo "No Detekt issues."
          fi

  run-ktlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/android-setup
      - name: Run KtLint composite action
        uses: ./.github/actions/ktlint
        with:
          gradle-flags: ${{ env.gradleFlags }}
      - name: Report-renderer
        uses: ./.github/actions/report-renderer
        with:
         input-file: ktlint-report.md
         output-file: ktlint-report.html
      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: merged-ktlint.sarif
          category: ktlint
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-html-report
          path: ktlint-report.html

  check-app-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/android-setup
      - name: Analyze size
        run: ./gradlew :app:analyzeDebugBundle $gradleFlags
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ruler-report.html
          path: app/build/reports/ruler/debug/report.html

  # Здоровье дерева зависимостей: buildHealth (неиспользуемые/неверно объявленные
  # зависимости) — рекомендательный, dependencyGuard — блокирующий: любое изменение
  # release-classpath приложения должно приезжать осознанным diff'ом слепка.
  check-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/android-setup
      - name: Dependency analysis
        run: ./gradlew buildHealth $gradleFlags
      - name: Publish advice to summary
        if: always()
        run: |
          REPORT=build/reports/dependency-analysis/build-health-report.txt
          {
            echo '## Dependency analysis'
            if [ -f "$REPORT" ]; then
              echo "Полный отчёт — в артефакте \`dependency-analysis-report\` ($(wc -l < "$REPORT") строк)."
              echo '```'
              head -200 "$REPORT"
              echo '```'
            else
              echo 'Отчёт не сформирован.'
            fi
          } >> $GITHUB_STEP_SUMMARY
      - name: Upload dependency analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-analysis-report
          path: build/reports/dependency-analysis/
      # Падает, если release-classpath разошёлся с app/dependencies/*.txt.
      # Обновить слепок: ./gradlew :app:dependencyGuardBaseline
      - name: Dependency guard
        run: ./gradlew :app:dependencyGuard $gradleFlags

  check-module-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/android-setup
      - name: Check Graph
        run: ./gradlew :app:assertModuleGraph $gradleFlags
      - name: Generate graph
        run: ./gradlew :app:generateModulesGraphvizText -Pmodules.graph.output.gv=all_modules $gradleFlags
      - name: Generate Markdown report
        run: |
          set -e
          echo '```' > $GITHUB_STEP_SUMMARY
          cat all_modules >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Draw graph
        uses: ./.github/actions/draw-graph
        with:
          input-file: all_modules
          output-file: all_modules.png
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: all_modules.png
          path: all_modules.png

  nav-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/android-setup
      - name: Nav graph report
        uses: ./.github/actions/nav-graph
        with:
          gradle-flags: ${{ env.gradleFlags }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav-graph-report
          path: nav-graph-report
