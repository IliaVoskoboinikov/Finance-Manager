name: Dependency submission

# Отдаёт GitHub полный граф зависимостей проекта (Dependency graph → Insights).
# Без него не работают Dependabot alerts по уязвимостям и dependency-review на PR:
# GitHub не умеет сам разбирать libs.versions.toml + convention-плагины.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  API_TOKEN: ${{ secrets.API_TOKEN }}
  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Граф уходит через API (токен передаёт сам action), git-токен в .git/config не нужен.
          persist-credentials: false
      - name: Create google-services.json
        uses: ./.github/actions/create-google-services
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      # Действие само поднимает Gradle и резолвит все конфигурации проекта,
      # поэтому отдельный setup-gradle (init-gradle) здесь не нужен.
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        env:
          # Scope в Dependabot: runtime — только то, что уезжает в APK; всё остальное
          # (плагины, lint, ktlint, detekt, KSP) помечается development, и алерты
          # фильтруются по scope:runtime / scope:development. Входа у action для этого
          # нет — переменную напрямую читает dependency-graph плагин внутри Gradle.
          DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: 'releaseRuntimeClasspath'
        with:
          # Тестовые и инструментальные конфигурации в проде не живут — не шумим ими в алертах.
          # *TestLintChecksClasspath — конфигурации AGP 9 для lint юнит-/android-тестов:
          # в них протекают testImplementation-зависимости (robolectric, mockk, junit).
          dependency-graph-exclude-configurations: '.*[Tt]est(Compile|Runtime|LintChecks)Classpath'
