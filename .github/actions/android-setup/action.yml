name: Android Setup
description: Checkout + Gradle init + Google Services setup

inputs:
  google-services-required:
    description: "'true' — падать без секрета GOOGLE_SERVICES_JSON (релизные сборки)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Init Gradle
      uses: ./.github/actions/init-gradle

    - name: Create google-services.json
      uses: ./.github/actions/create-google-services
      with:
        required: ${{ inputs.google-services-required }}
