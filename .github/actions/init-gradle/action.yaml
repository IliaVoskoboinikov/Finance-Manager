name: Setup Gradle Environment
description: Setup gradle environment

runs:
  using: 'composite'
  steps:
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        # cache: gradle здесь НЕ включаем — кэшем Gradle User Home управляет
        # gradle/actions/setup-gradle ниже. Два механизма поверх одного каталога
        # дают гонку при сохранении и лишний трафик.
    # Кэш Gradle User Home пишется только с master, остальные ветки читают его
    # read-only — это поведение по умолчанию, отдельных входов не требуется.
    # v6 по умолчанию использует enhanced caching (бесплатно для публичных репозиториев).
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x gradlew
