##############################################
#                  Versions
##############################################

[versions]

# Build & Kotlin
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.9"
coroutines = "1.11.0"
buildTimeTracker = "5.0.2"
graphPlugin = "2.9.1"
ktlint = "14.2.0"
# Версия самого ktlint (CLI), а не gradle-плагина выше. Общая для корня и build-logic:
# без неё build-logic молча брал дефолт плагина (1.5.0) с уязвимым logback.
ktlintCli = "1.8.0"
ruler = "2.0.0-beta-3"
kotlinMetadataJvm = "2.4.20"

# AndroidX Core
coreKtx = "1.19.0"
appcompat = "1.7.1"
lifecycleProcess = "2.10.0"
securityCrypto = "1.1.0"
tracingKtx = "1.3.0"
biometricKtx = "1.4.0-alpha02"

# Datastore & Storage
datastore = "1.2.1"
room = "2.8.4"
workManager = "2.11.2"

# Compose
composeBom = "2026.05.01"
materialIconsExtended = "1.7.8"
navigation3 = "1.1.5"
# 2.11.0 требует compileSdk 37 (а он же уходит в targetSdk) — остаёмся на линейке lifecycle 2.10.x.
lifecycleViewmodelNavigation3 = "2.10.0"
kotlinxSerialization = "1.11.0"

# UI Libraries
lottieCompose = "6.7.1"
colorPicker = "1.2.0"
ycharts = "2.1.0"

# Dependency Injection
hilt = "2.59.2"
hiltExt = "1.3.0"

# Networking
retrofit = "3.0.0"
converterGson = "3.0.0"
loggingInterceptor = "5.4.0"

# Auth (OAuth)
yandexAuthSdk = "3.1.3"

# Navigation graph visualisation (KSP + Gradle plugin + IDE plugin)
navgraph = "0.2.1"

# Lint & QA Tools
detekt = "1.23.8"
detektCompose = "0.6.7"
lint = "32.4.1"
kover = "0.9.11"
dependencyAnalysis = "3.19.2"
dependencyGuard = "0.5.0"
konsist = "0.17.3"
gradleDoctor = "0.12.0"
affectedModuleDetector = "0.6.2"

#Firebase
gmsPlugin = "4.5.0"
firebaseBom = "34.15.0"
firebaseCrashlyticsPlugin = "3.0.7"

# TEST
junit = "4.13.2"
kotlinxCoroutinesTest = "1.11.0"
assertjCore = "3.27.7"
mockk = "1.14.11"
robolectric = "4.17"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
androidxTestCore = "1.6.1"

# Security constraints
# Исправленные версии транзитивных зависимостей build-tooling (в APK они не попадают).
# Сами плагины уже на последних версиях, но тянут библиотеки с известными CVE
# (Dependabot). Подключаются как constraints — см. docs/dependency-vulnerabilities.md.
# Когда родитель сам подтянет версию не ниже этой, constraint можно удалить.
bouncycastle = "1.86"        # было 1.80.2: AGP/lint → sdk-common
commonsLang3 = "3.21.0"      # было 3.16.0: AGP/lint → commons-compress
apacheHttpclient = "4.5.14"  # было 4.5.6: lint → sdklib
jose4j = "0.9.7"             # было 0.9.5: AGP → bundletool
jdom2 = "2.0.6.1"            # было 2.0.6: AGP → jetifier-processor
freemarker = "2.3.35"        # было 2.3.32: Kover → intellij coverage-report
snakeyaml = "2.7"            # было 1.30: Ruler
logback = "1.5.38"           # было 1.3.16: ktlint-cli

##############################################
#                  Libraries
##############################################

[libraries]

# Build Tools
agp = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-plugin = { group = "org.jetbrains.kotlin.plugin.compose", name = "org.jetbrains.kotlin.plugin.compose.gradle.plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-serialization", version.ref = "kotlin" }
build-time-tracker = { module = "com.asarkar.gradle:build-time-tracker", version.ref = "buildTimeTracker" }

# AndroidX Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-biometric-ktx = { module = "androidx.biometric:biometric-ktx", version.ref = "biometricKtx" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycleProcess" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
androidx-tracing-ktx = { module = "androidx.tracing:tracing-ktx", version.ref = "tracingKtx" }

# Datastore & Storage
androidx-datastore-core = { group = "androidx.datastore", name = "datastore-core-android", version.ref = "datastore" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime-android", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-work-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "workManager" }

# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }

# Navigation 3
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNavigation3" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }

# UI Libraries
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottieCompose" }
colorpicker-compose = { module = "com.github.skydoves:colorpicker-compose", version.ref = "colorPicker" }
ycharts = { module = "co.yml:ycharts", version.ref = "ycharts" }

# Dependency Injection
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltExt" }
hilt-ext-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltExt" }
hilt-ext-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltExt" }
javax-inject = { module = "javax.inject:javax.inject", version = "1" }

# Networking
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "loggingInterceptor" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "converterGson" }

# Auth (OAuth)
yandex-authsdk = { module = "com.yandex.android:authsdk", version.ref = "yandexAuthSdk" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

# Static analysis
detekt-gradle = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
detekt-compose = { module = "io.nlopez.compose.rules:detekt", version.ref = "detektCompose" }
lint-api = { group = "com.android.tools.lint", name = "lint-api", version.ref = "lint" }
lint-checks = { group = "com.android.tools.lint", name = "lint-checks", version.ref = "lint" }
lint-cli = { group = "com.android.tools.lint", name = "lint", version.ref = "lint" }
lint-tests = { group = "com.android.tools.lint", name = "lint-tests", version.ref = "lint" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlin-metadata-jvm = { group = "org.jetbrains.kotlin", name = "kotlin-metadata-jvm", version.ref = "kotlinMetadataJvm" }
ruler-plugin = { group = "com.spotify.ruler", name = "ruler-gradle-plugin", version.ref = "ruler" }
module-graph-plugin = { module = "com.jraska.module.graph.assertion:plugin", version.ref = "graphPlugin" }
dependency-guard-plugin = { module = "com.dropbox.dependency-guard:dependency-guard", version.ref = "dependencyGuard" }
navgraph-gradle-plugin = { group = "com.github.skydoves", name = "compose-nav-graph-gradle", version.ref = "navgraph" }

#Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
# Версия приходит из firebase-bom — как и у crashlytics.
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

# TEST
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertjCore" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Security constraints — не зависимости, а только constraints (см. [versions] → Security constraints)
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3" }
apache-httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "apacheHttpclient" }
jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "jose4j" }
jdom2 = { module = "org.jdom:jdom2", version.ref = "jdom2" }
freemarker = { module = "org.freemarker:freemarker", version.ref = "freemarker" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
# Нигде не подключается: версия ktlint CLI задаётся строкой в KtlintExtension, а запись
# здесь нужна, чтобы Renovate видел ktlintCli и предлагал обновления.
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlintCli" }

##############################################
#                  Bundles
##############################################

[bundles]

# Default unit-test stack applied to every module via the soft.divan convention plugins.
unit-test = ["junit", "mockk", "assertj-core", "kotlinx-coroutines-test"]

# Security constraints по месту резолва (docs/dependency-vulnerabilities.md):
# AGP/lint — buildscript classpath корня и androidLintTool каждого модуля;
security-constraints-agp = ["bouncycastle-bcprov", "bouncycastle-bcpkix", "bouncycastle-bcutil", "commons-lang3", "apache-httpclient"]
# прочие плагины — только buildscript classpath корня (Kover, Ruler, AGP → bundletool/jetifier);
security-constraints-buildscript = ["freemarker", "snakeyaml", "jose4j", "jdom2"]
# ktlint — его конфигурация `ktlint` (корень и build-logic).
security-constraints-ktlint = ["logback-classic", "logback-core"]

##############################################
#                  Plugins
##############################################

[plugins]

# Android & Kotlin
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
java-library = { id = "java-library" }

# DI
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# Tools
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
graph = { id = "com.jraska.module.graph.assertion", version.ref = "graphPlugin" }
build-time-tracker = { id = "com.asarkar.gradle.build-time-tracker", version.ref = "buildTimeTracker" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
ruler = { id = "com.spotify.ruler", version.ref = "ruler" }
navgraph = { id = "com.github.skydoves.navgraph", version.ref = "navgraph" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependencyAnalysis" }
dependency-guard = { id = "com.dropbox.dependency-guard", version.ref = "dependencyGuard" }
gradle-doctor = { id = "com.osacky.doctor", version.ref = "gradleDoctor" }
affected-module-detector = { id = "com.dropbox.affectedmoduledetector", version.ref = "affectedModuleDetector" }

#Firebase
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
gms = { id = "com.google.gms.google-services", version.ref = "gmsPlugin" }

# Custom Plugins
soft-divan-android-base = { id = "soft.divan.android.base" }
soft-divan-android-app = { id = "soft.divan.android.app" }
soft-divan-core = { id = "soft.divan.core" }
soft-divan-feature-api = { id = "soft.divan.feature.api" }
soft-divan-feature-impl = { id = "soft.divan.feature.impl" }
soft-divan-jvm-library = { id = "soft.divan.jvm.library" }
soft-divan-hilt = { id = "soft.divan.hilt" }
soft-divan-build-time-tracker = { id = "soft.divan.build.time.tracker" }
soft-divan-firebase = { id = "soft.divan.firebase" }
soft-divan-check-conventions = { id = "soft.divan.check.conventions" }
soft-divan-ruler = { id = "soft.divan.ruler" }
soft-divan-dependency-guard = { id = "soft.divan.dependency.guard" }
soft-divan-module-graph = { id = "soft.divan.module.graph" }


